<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Kifiya Experience VR</title>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene vr-mode-ui="enabled: true">

      <!-- Camera and gaze cursor -->
      <a-entity camera look-controls>
        <a-cursor fuse="true" fuse-timeout="1500"></a-cursor>
      </a-entity>

      <!-- Floor -->
      <a-plane rotation="-90 0 0" width="20" height="20" color="#111"></a-plane>

      <!-- Floating screen placeholder for your demo -->
      <a-plane
        position="0 1.6 -3"
        width="4"
        height="2.25"
        color="#ffffff"
        material="shader: flat">
        <!-- Optional: you can place a 360° screenshot or video of your demo here -->
      </a-plane>

    </a-scene>
  </body>
</html>
